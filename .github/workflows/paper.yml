name: paper
# Rebuilds the technical report from committed eval outputs on every push and commits the PDF to
# web/public/paper.pdf (served by the site). Numbers come only from paper/generated/*.typ.
on:
  push:
    branches: [main]
    paths: ["paper/**", "eval/results/**", "web/public/data/**", "config/**", ".github/workflows/paper.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[paper-bot]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy matplotlib pyyaml typst
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-lmodern fonts-linuxlibertine
      - run: python paper/build.py
      - uses: actions/upload-artifact@v4
        with: { name: paper, path: paper/paper.pdf }
      - name: Commit PDF
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add web/public/paper.pdf paper/generated paper/figures
          git diff --cached --quiet || (git commit -m "Rebuild technical report [paper-bot]" && git push)
