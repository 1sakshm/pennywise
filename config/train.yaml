seed: 0

data:
  split: [0.6, 0.2, 0.2]   # train / val / test, stratified by source
  per_source:               # target prompt counts (Phase 2). Easy + hard mix: 2026 models saturate
    gsm8k: 100              # GSM8K/ARC/MBPP alone (pilot: then-small tier 93%), see DECISIONS.md
    math: 150               # MATH-500 levels 4-5
    arc: 100
    mmlu_pro: 200
    mbpp: 200
    alan_bugfix: 100        # half single-bug, half two-bug; longer functions
    alan_triage: 100
  budget_usd: 12.0          # run_models.py stops when spend exceeds this

sft:
  lr: 2.0e-5
  epochs: 10
  batch_size: 8
  grad_accum: 2
  patience: 3               # early stopping on val loss
  train_encoder_layers: 4   # top-N encoder layers unfrozen + decision head (4 GB VRAM)

rl:
  lambdas: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]
  steps: 800                # ~22 passes over 570 train prompts; ~11 min per lambda on an RTX 3050
  batch_size: 16
  lr: 5.0e-6
  entropy_beta_start: 0.05
  entropy_beta_end: 0.005
  baseline: running_mean    # running_mean | batch_mean
  baseline_momentum: 0.95
  snapshot_every: 40

eval:
  bootstrap: 1000
