# Model tiers for the router. All three MUST be open-weight models that support
# OpenAI-style tool calling (Alan/OpenCode agent sessions run through them).
#
# Every endpoint is OpenAI-compatible. api_key_env names the env var holding the key
# (never put keys in this file). Prices are USD per 1M tokens; cost accounting everywhere
# is derived from these numbers.
#
# Free-tier runs (e.g. NVIDIA's API, base_url https://integrate.api.nvidia.com/v1): actual spend
# is $0, so prices are the PUBLIC LIST PRICE of the same model on a paid provider, recorded in
# price_source. The reward then reflects what a paying user would be charged. Say so wherever
# costs are reported. rpm caps requests/minute per key (free tiers rate-limit per account).
#
# Code refuses to run while any field is FILL_ME.

tiers:
  small:
    base_url: https://integrate.api.nvidia.com/v1   # NVIDIA free tier (actual spend $0)
    api_key_env: NVIDIA_API_KEY
    model: nvidia/nemotron-3.5-bolt-e4b
    price_in_per_m: 0.04
    price_out_per_m: 0.05
    supports_tools: true
    price_source: "No paid listing for nemotron-3.5-bolt-e4b found; proxy = OpenRouter list price of google/gemma-3-4b-it (same ~4B class), 2026-10-26"
  medium:
    base_url: https://integrate.api.nvidia.com/v1   # NVIDIA free tier (actual spend $0)
    api_key_env: NVIDIA_API_KEY
    model: openai/gpt-oss-20b
    price_in_per_m: 0.018
    price_out_per_m: 0.09
    supports_tools: true
    price_source: "OpenRouter list price for openai/gpt-oss-20b, 2026-10-26"
  large:
    base_url: https://integrate.api.nvidia.com/v1   # NVIDIA free tier (actual spend $0)
    api_key_env: NVIDIA_API_KEY
    model: nvidia/nemotron-3-ultra-550b-a55b
    price_in_per_m: 0.60
    price_out_per_m: 2.40
    supports_tools: true
    price_source: "OpenRouter list price for nvidia/nemotron-3-ultra-550b-a55b, 2026-10-26"

# Request defaults used for dataset generation (Phase 2)
generation:
  temperature: 0.0
  max_tokens: 4096               # reasoning-style models think in the answer; 1024 truncated them in the pilot
  timeout_s: 240
  concurrency: 8
  max_retries: 8
  rpm: 30                        # NVIDIA free tier ~40 RPM, stricter on some models; 0 = unlimited
